services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petir}
      POSTGRES_DB: ${POSTGRES_DB:-petir}
    expose:
      - "5432"
    volumes:
      - petir_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petir}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-petir}:${POSTGRES_PASSWORD:-petir}@postgres:5432/${POSTGRES_DB:-petir}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-petir}:${POSTGRES_PASSWORD:-petir}@postgres:5432/${POSTGRES_DB:-petir}
      DASHBOARD_AUTH_ENABLED: ${DASHBOARD_AUTH_ENABLED:-false}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      # Fail closed by default. Petir 1 legacy deployments must opt in explicitly.
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-disabled}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
      CLOUDFLARE_ACCESS_ADMIN_EMAILS: ${CLOUDFLARE_ACCESS_ADMIN_EMAILS:-}
      CLOUDFLARE_ACCESS_OPERATOR_EMAILS: ${CLOUDFLARE_ACCESS_OPERATOR_EMAILS:-}
      HEALTH_RESPONSE_MODE: ${HEALTH_RESPONSE_MODE:-legacy_full}
      PUBLIC_DATA_MODE: ${PUBLIC_DATA_MODE:-legacy_full}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SIREN_AUDIT_ENABLED: ${SIREN_AUDIT_ENABLED:-false}
      SIREN_AUDIT_OPERATORS_JSON: ${SIREN_AUDIT_OPERATORS_JSON:-[]}
      WAN_FAILOVER_SNAPSHOT_DIR: ${WAN_FAILOVER_SNAPSHOT_DIR:-/app/snapshots}
      RATE_LIMIT_PER_NODE: ${RATE_LIMIT_PER_NODE:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      INVALID_BEARER_MAX_FAILURES: ${INVALID_BEARER_MAX_FAILURES:-10}
      INVALID_BEARER_WINDOW_SECONDS: ${INVALID_BEARER_WINDOW_SECONDS:-60}
      INVALID_BEARER_BLOCK_SECONDS: ${INVALID_BEARER_BLOCK_SECONDS:-300}
      INVALID_BEARER_MAX_CLIENTS: ${INVALID_BEARER_MAX_CLIENTS:-10000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      QUERY_STATEMENT_TIMEOUT_MS: ${QUERY_STATEMENT_TIMEOUT_MS:-3000}
      EXPORT_STATEMENT_TIMEOUT_MS: ${EXPORT_STATEMENT_TIMEOUT_MS:-5000}
      QUERY_MAX_PAGE_ROWS: ${QUERY_MAX_PAGE_ROWS:-10000}
      HISTORY_MAX_BUCKETS: ${HISTORY_MAX_BUCKETS:-10000}
      WEATHER_RAW_ESTIMATED_ROWS_PER_MINUTE: ${WEATHER_RAW_ESTIMATED_ROWS_PER_MINUTE:-12}
      WEATHER_RAW_MAX_ESTIMATED_ROWS: ${WEATHER_RAW_MAX_ESTIMATED_ROWS:-150000}
      QUALITY_MAX_ESTIMATED_MINUTE_ROWS: ${QUALITY_MAX_ESTIMATED_MINUTE_ROWS:-600000}
      LIGHTNING_EVENT_ESTIMATED_ROWS_PER_MINUTE: ${LIGHTNING_EVENT_ESTIMATED_ROWS_PER_MINUTE:-2}
      LIGHTNING_EVENT_MAX_ESTIMATED_ROWS: ${LIGHTNING_EVENT_MAX_ESTIMATED_ROWS:-300000}
      LIGHTNING_EXPORT_MAX_ESTIMATED_ROWS: ${LIGHTNING_EXPORT_MAX_ESTIMATED_ROWS:-100000}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    volumes:
      - /mnt/data/petirdashboard/snapshots:/app/snapshots:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://server:8000}
      PETIR_RAIN_SEMANTICS: ${PETIR_RAIN_SEMANTICS:-legacy}
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  petir_pg:
