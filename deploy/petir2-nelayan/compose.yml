name: petir2_nelayan

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: petir2_admin
      POSTGRES_PASSWORD: ${PETIR2_DB_ADMIN_PASSWORD:?set PETIR2_DB_ADMIN_PASSWORD}
      POSTGRES_DB: petir2_nelayan
      PETIR2_MIGRATOR_DB_PASSWORD: ${PETIR2_MIGRATOR_DB_PASSWORD:?set PETIR2_MIGRATOR_DB_PASSWORD}
      PETIR2_APP_DB_PASSWORD: ${PETIR2_APP_DB_PASSWORD:?set PETIR2_APP_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - ${PETIR2_POSTGRES_DATA_DIR:-/mnt/data/apps/petir2-nelayan/postgres}:/var/lib/postgresql/data
      - ./initdb/10-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petir2_admin -d petir2_nelayan"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  migrate:
    profiles: ["migration"]
    image: petir2-server:${PETIR2_IMAGE_TAG:?set immutable PETIR2_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: server/Dockerfile
      labels:
        org.opencontainers.image.revision: ${PETIR2_GIT_SHA:?set PETIR2_GIT_SHA}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://petir2_migrator:${PETIR2_MIGRATOR_DB_PASSWORD}@postgres:5432/petir2_nelayan
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  server:
    image: petir2-server:${PETIR2_IMAGE_TAG:?set immutable PETIR2_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: server/Dockerfile
      labels:
        org.opencontainers.image.revision: ${PETIR2_GIT_SHA:?set PETIR2_GIT_SHA}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://petir2_app:${PETIR2_APP_DB_PASSWORD}@postgres:5432/petir2_nelayan
      DASHBOARD_AUTH_ENABLED: ${PETIR2_DASHBOARD_AUTH_ENABLED:?set PETIR2_DASHBOARD_AUTH_ENABLED}
      DASHBOARD_API_KEY: ${PETIR2_DASHBOARD_API_KEY:-}
      ADMIN_AUTH_MODE: ${PETIR2_ADMIN_AUTH_MODE:-disabled}
      ADMIN_API_KEY: ${PETIR2_ADMIN_API_KEY:-}
      OPERATOR_API_KEY: ${PETIR2_OPERATOR_API_KEY:-}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${PETIR2_CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${PETIR2_CLOUDFLARE_ACCESS_AUDIENCE:-}
      CLOUDFLARE_ACCESS_ADMIN_EMAILS: ${PETIR2_CLOUDFLARE_ACCESS_ADMIN_EMAILS:-}
      CLOUDFLARE_ACCESS_OPERATOR_EMAILS: ${PETIR2_CLOUDFLARE_ACCESS_OPERATOR_EMAILS:-}
      CLOUDFLARE_JWKS_PROXY_URL: http://jwks-egress-proxy:3128
      HEALTH_RESPONSE_MODE: "public_safe"
      PUBLIC_DATA_MODE: "public_safe"
      API_DOCS_ENABLED: "false"
      SIREN_AUDIT_ENABLED: "false"
      SIREN_AUDIT_OPERATORS_JSON: ${PETIR2_SIREN_AUDIT_OPERATORS_JSON:-[]}
      WAN_FAILOVER_SNAPSHOT_DIR: /app/snapshots
      RATE_LIMIT_PER_NODE: ${PETIR2_RATE_LIMIT_PER_NODE:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${PETIR2_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ALLOW_ORIGINS: ${PETIR2_CORS_ALLOW_ORIGINS:-}
    volumes:
      - ${PETIR2_SNAPSHOT_DIR:-/mnt/data/apps/petir2-nelayan/snapshots}:/app/snapshots:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - jwks_client

  jwks-egress-proxy:
    profiles: ["cloudflare-access"]
    image: petir2-jwks-egress-proxy:${PETIR2_IMAGE_TAG:?set immutable PETIR2_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: deploy/jwks-egress-proxy/Dockerfile
      labels:
        org.opencontainers.image.revision: ${PETIR2_GIT_SHA:?set PETIR2_GIT_SHA}
    restart: unless-stopped
    environment:
      ALLOWED_JWKS_HOST: ${PETIR2_CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:size=1m,mode=0755
      - /var/spool/squid:size=16m,uid=13,gid=13,mode=0750
    security_opt:
      - no-new-privileges:true
    networks:
      - jwks_client
      - jwks_egress

  web:
    image: petir2-web:${PETIR2_IMAGE_TAG:?set immutable PETIR2_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
      labels:
        org.opencontainers.image.revision: ${PETIR2_GIT_SHA:?set PETIR2_GIT_SHA}
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:8000
      HOSTNAME: "0.0.0.0"
      PETIR_SITE_NAME: ${PETIR_SITE_NAME:-Nelayan Sungailiat}
      PETIR_STATION_VERSION: ${PETIR_STATION_VERSION:-2.0}
      PETIR_SITE_ID: ${PETIR_SITE_ID:-nelayan-sungailiat}
      PETIR_PUBLIC_DOMAIN: ${PETIR_PUBLIC_DOMAIN:-nelayan-sungailiat.petirlabs.com}
      PETIR_RAIN_SEMANTICS: ${PETIR_RAIN_SEMANTICS:-rolling_1m_max}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3020:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - host_ingress

networks:
  internal:
    internal: true
  host_ingress:
    driver: bridge
  jwks_client:
    driver: bridge
    internal: true
  jwks_egress:
    driver: bridge
