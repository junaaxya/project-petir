name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petir_test
          POSTGRES_PASSWORD: petir_test
          POSTGRES_DB: petir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petir_test -d petir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://petir_test:petir_test@127.0.0.1:5432/petir_test
      TEST_DATABASE_URL: postgresql+psycopg://petir_test:petir_test@127.0.0.1:5432/petir_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install -e 'packages/contracts[test]' -e 'server[test]' -e 'edge[test]'
      - name: Contract, edge, and server unit tests
        run: .venv/bin/pytest -q packages/contracts/tests edge/tests server/tests/unit
      - name: PostgreSQL integration tests (no skips)
        run: |
          .venv/bin/pytest -q server/tests/integration --junitxml=server-integration.xml
          .venv/bin/python scripts/check_junit_no_skips.py server-integration.xml
      - name: PostgreSQL E2E tests (no skips)
        run: |
          .venv/bin/pytest -q tests/e2e --junitxml=e2e-tests.xml
          .venv/bin/python scripts/check_junit_no_skips.py e2e-tests.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config -q
      - run: docker compose --env-file deploy/petir2-nelayan/.env.example -f deploy/petir2-nelayan/compose.yml config -q
      - run: docker compose --profile migration --env-file deploy/petir2-nelayan/.env.example -f deploy/petir2-nelayan/compose.yml config -q
      - run: python scripts/check_petir2_compose.py
      - run: sh -n deploy/petir2-nelayan/initdb/10-create-app-role.sh

  docker:
    runs-on: ubuntu-latest
    needs: [python, web, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --label org.opencontainers.image.revision=${GITHUB_SHA} -t petir2-server:${GITHUB_SHA} -f server/Dockerfile .
      - name: Verify backend does not auto-migrate
        run: |
          command_json=$(docker image inspect petir2-server:${GITHUB_SHA} --format '{{json .Config.Cmd}}')
          echo "$command_json"
          test "$command_json" = '["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]'
      - name: Build frontend image
        run: docker build --label org.opencontainers.image.revision=${GITHUB_SHA} -t petir2-web:${GITHUB_SHA} -f web/Dockerfile .
      - name: Smoke-test frontend runtime
        run: |
          internal_network="petir2-ci-internal-${GITHUB_RUN_ID}"
          ingress_network="petir2-ci-ingress-${GITHUB_RUN_ID}"
          docker network create --internal "$internal_network" >/dev/null
          docker network create "$ingress_network" >/dev/null
          cleanup() {
            docker stop "$default_cid" "$branded_cid" >/dev/null 2>&1 || true
            docker network rm "$internal_network" "$ingress_network" >/dev/null 2>&1 || true
          }
          default_cid=""
          branded_cid=""
          trap cleanup EXIT
          default_cid=$(docker run --rm -d --network "$internal_network" -p 127.0.0.1:39020:3000 \
            -e HOSTNAME=0.0.0.0 \
            -e API_PROXY_TARGET=http://127.0.0.1:9 \
            petir2-web:${GITHUB_SHA})
          docker network connect "$ingress_network" "$default_cid"
          branded_cid=$(docker run --rm -d --network "$internal_network" -p 127.0.0.1:39021:3000 \
            -e HOSTNAME=0.0.0.0 \
            -e API_PROXY_TARGET=http://127.0.0.1:9 \
            -e PETIR_SITE_NAME='Nelayan Sungailiat' \
            -e PETIR_STATION_VERSION='2.0' \
            -e PETIR_SITE_ID='nelayan-sungailiat' \
            -e PETIR_PUBLIC_DOMAIN='nelayan-sungailiat.petirlabs.com' \
            petir2-web:${GITHUB_SHA})
          docker network connect "$ingress_network" "$branded_cid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:39020/ >/tmp/petir-home.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:39020/petirlabs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:39020/lightning >/dev/null
          asset=$(grep -oE '/_next/static/[^" ]+\.(css|js)' /tmp/petir-home.html | head -n1)
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:39020${asset}" >/dev/null
          grep -Fq '<title>PetirDashboard</title>' /tmp/petir-home.html
          grep -Fq 'data-petir-site-id="petir-dashboard"' /tmp/petir-home.html
          python -c "s=open('/tmp/petir-home.html').read(); assert 'data-site-identity' not in s"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:39021/ >/tmp/petir2-home.html; then
              break
            fi
            sleep 1
          done
          grep -Fq '<title>Nelayan Sungailiat | PetirDashboard</title>' /tmp/petir2-home.html
          grep -Fq 'data-petir-site-id="nelayan-sungailiat"' /tmp/petir2-home.html
          grep -Fq 'data-petir-station-version="2.0"' /tmp/petir2-home.html
          grep -Fq '>Nelayan Sungailiat<' /tmp/petir2-home.html
          python -c "import re; s=open('/tmp/petir2-home.html').read(); assert 'Stasiun 2.0' in re.sub(r'<[^>]*>', '', s)"
